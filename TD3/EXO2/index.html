<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <link rel="stylesheet" href="style.css">
    <title>Exercice 2 - Objets géolocalisés dans la caméra</title>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- playsinline + muted : obligatoires sur iOS pour lire la vidéo sans plein écran -->
    <video id="camera" autoplay playsinline muted></video>

    <div id="hud">
        <button id="start-btn">Démarrer</button>
        <button id="target-btn" disabled>Cible suivante</button>
        <div id="status"></div>
        <div id="position"></div>
        <div id="heading"></div>
        <div id="target"></div>
    </div>

    <!-- Mini-carte : boussole 2D avec les directions des objets -->
    <div id="minimap"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
